version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: medria
      POSTGRES_USER: medria
      POSTGRES_PASSWORD: medria
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
